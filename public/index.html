<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetZirve - Canlı Bahis ve Casino</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 0; }
        header { background: #1e293b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { color: #22c55e; font-weight: bold; font-size: 20px; }
        .balance { background: #334155; padding: 8px 15px; border-radius: 8px; color: #22c55e; font-weight: bold; }
        .container { padding: 15px; }
        .section-title { font-size: 18px; margin-bottom: 10px; color: #38bdf8; border-left: 4px solid #38bdf8; padding-left: 8px; }
        .match-card { background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .match-info { font-size: 14px; }
        .match-teams { font-weight: bold; margin-bottom: 5px; }
        .odds { display: flex; gap: 5px; }
        .odd-btn { background: #334155; border: none; color: #fff; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .odd-btn:hover { background: #22c55e; color: #000; }
        .support-btn { position: fixed; bottom: 20px; right: 20px; background: #22c55e; color: #000; padding: 12px 20px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ BETZİRVE</div>
        <div class="balance" id="wallet-balance">Bakiyen: Yükleniyor...</div>
    </header>

    <div class="container">
        <div class="section-title">Canlı Bahis Bülteni & Maçlar</div>
        
        <div class="match-card">
            <div class="match-info">
                <div class="match-teams">Galatasaray - Fenerbahçe</div>
                <div style="color: #94a3b8; font-size: 12px;">Süper Lig • Canlı</div>
            </div>
            <div class="odds">
                <button class="odd-btn" onclick="addCoupon('Galatasaray - Fenerbahçe (MS 1)', 1.80)">1: 1.80</button>
                <button class="odd-btn" onclick="addCoupon('Galatasaray - Fenerbahçe (MS X)', 3.40)">0: 3.40</button>
                <button class="odd-btn" onclick="addCoupon('Galatasaray - Fenerbahçe (MS 2)', 4.10)">2: 4.10</button>
            </div>
        </div>

        <div class="match-card">
            <div class="match-info">
                <div class="match-teams">Real Madrid - Barcelona</div>
                <div style="color: #94a3b8; font-size: 12px;">La Liga • Canlı</div>
            </div>
            <div class="odds">
                <button class="odd-btn" onclick="addCoupon('Real Madrid - Barcelona (MS 1)', 2.10)">1: 2.10</button>
                <button class="odd-btn" onclick="addCoupon('Real Madrid - Barcelona (MS X)', 3.20)">0: 3.20</button>
                <button class="odd-btn" onclick="addCoupon('Real Madrid - Barcelona (MS 2)', 3.00)">2: 3.00</button>
            </div>
        </div>

        <div class="match-card">
            <div class="match-info">
                <div class="match-teams">Amedspor - ığdır FK</div>
                <div style="color: #94a3b8; font-size: 12px;">1. Lig • Canlı</div>
            </div>
            <div class="odds">
                <button class="odd-btn" onclick="addCoupon('Amedspor - Iğdır FK (MS 1)', 1.70)">1: 1.70</button>
                <button class="odd-btn" onclick="addCoupon('Amedspor - Iğdır FK (MS X)', 3.50)">0: 3.50</button>
                <button class="odd-btn" onclick="addCoupon('Amedspor - Iğdır FK (MS 2)', 4.50)">2: 4.50</button>
            </div>
        </div>

        <div style="background: #1e293b; padding: 15px; border-radius: 10px; margin-top: 20px;">
            <div style="font-weight: bold; margin-bottom: 8px;">Bahis Kuponu</div>
            <div id="coupon-content" style="color: #94a3b8; font-size: 14px;">Henüz bir maç seçmediniz. Oranlara tıklayarak kupon oluşturun.</div>
        </div>
    </div>

    <button class="support-btn" onclick="alert('Canlı destek hattına bağlandınız. Müşteri temsilcimiz birazdan sizinle ilgilenecektir.')">💬 Canlı Destek</button>

    <script>
        fetch('/api/wallet')
            .then(res => res.json())
            .then(data => {
                document.getElementById('wallet-balance').innerText = 'Bakiyen: $' + data.balance.toFixed(2);
            });

        function addCoupon(match, odd) {
            document.getElementById('coupon-content').innerHTML = `<div style="color: #22c55e; font-weight: bold;">Seçilen Maç: ${match}</div><div>Oran: ${odd}</div>`;
        }
    </script>
</body>
</html>
