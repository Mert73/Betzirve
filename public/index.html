<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Kayıt Ol</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121216; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        .auth-card { background: #1e1e24; padding: 25px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid #2a2a35; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00ffcc; margin-bottom: 20px; font-size: 1.5rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; background: #2a2a35; border: 1px solid #444; border-radius: 8px; color: #fff; outline: none; font-size: 0.95rem; }
        .input-group input:focus { border-color: #00ffcc; }
        .auth-btn { width: 100%; background: #00ffcc; color: #121216; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #aaa; }
        .switch-text span { color: #00ffcc; cursor: pointer; font-weight: bold; }
        .error-msg { color: #ff4d4d; font-size: 0.85rem; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="form-title">Giriş Yap</h2>
        <div id="error-box" class="error-msg"></div>
        
        <div class="input-group" id="name-group" style="display: none;">
            <label>Adınız</label>
            <input type="text" id="name" placeholder="Adınızı girin">
        </div>
        <div class="input-group">
            <label>E-posta Adresi</label>
            <input type="email" id="email" placeholder="ornek@mail.com">
        </div>
        <div class="input-group">
            <label>Şifre</label>
            <input type="password" id="password" placeholder="******">
        </div>

        <button class="auth-btn" id="submit-btn" onclick="handleSubmit()">Giriş Yap</button>
        
        <div class="switch-text" id="switch-text">
            Hesabın yok mu? <span onclick="toggleMode()">Kayıt Ol</span>
        </div>
    </div>

    <script>
        let isRegister = false;

        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById('form-title').innerText = isRegister ? 'Kayıt Ol' : 'Giriş Yap';
            document.getElementById('submit-btn').innerText = isRegister ? 'Kayıt Ol' : 'Giriş Yap';
            document.getElementById('name-group').style.display = isRegister ? 'block' : 'none';
            document.getElementById('switch-text').innerHTML = isRegister ? 
                'Zaten hesabın var mı? <span onclick="toggleMode()">Giriş Yap</span>' : 
                'Hesabın yok mu? <span onclick="toggleMode()">Kayıt Ol</span>';
            document.getElementById('error-box').innerText = '';
        }

        async function handleSubmit() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const errorBox = document.getElementById('error-box');

            if (!email || !password || (isRegister && !name)) {
                errorBox.innerText = 'Lütfen tüm alanları doldurun!';
                return;
            }

            const endpoint = isRegister ? '/api/register' : '/api/login';
            const bodyData = isRegister ? { name, email, password } : { email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = '/rooms';
                } else {
                    errorBox.innerText = data.message;
                }
            } catch (err) {
                errorBox.innerText = 'Bir hata oluştu, tekrar deneyin.';
            }
        }
    </script>
</body>
</html>
