<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoHo Zirve - Kazan & Eğlen Oyunları</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1f1f1f; border: 1px solid #333; border-radius: 12px; padding: 25px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; text-align: center; }
        button { background: #fe2c55; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        a { color: #fe2c55; text-decoration: none; font-weight: bold; }
        .wheel-box { width: 150px; height: 150px; border: 5px dashed #00f2fe; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 2em; animation: spin-slow 10s infinite linear; }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div style="width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;">
        <h2>🎮 Şans Oyunları Salonu</h2>
        <a href="/">← Ana Sayfa</a>
    </div>

    <div class="card">
        <h3 style="margin:0; color:#00f2fe;" id="balance-display">Bakiyen: Yükleniyor...</h3>
        <p style="color:#b0b0b0; font-size:0.9em;">Çarkı çevir, yatırdığın bakiyeyi 2x, 5x veya 10x katla!</p>
        
        <div class="wheel-box" id="wheel">🎯</div>
        
        <div style="display: flex; gap: 10px;">
            <button onclick="playWheel(5)" style="flex:1; background:#10b981;">$5 Oyna</button>
            <button onclick="playWheel(20)" style="flex:1; background:#f59e0b;">$20 Oyna</button>
        </div>
        <p id="game-result" style="font-weight: bold; margin: 0; min-height: 24px;"></p>
    </div>

    <script>
        const socket = io();
        const username = localStorage.getItem('yoho_username') || 'Misafir';

        socket.emit('join-room', { username, room: 'Games' });

        socket.on('wallet-update', (wallet) => {
            document.getElementById('balance-display').innerText = `Bakiyen: $${wallet.balanceUSD.toFixed(2)}`;
        });

        function playWheel(betAmount) {
            socket.emit('play-game-wheel', { username, betAmount });
        }

        socket.on('game-result-response', (data) => {
            const resEl = document.getElementById('game-result');
            if (data.success) {
                resEl.style.color = '#10b981';
                resEl.innerText = `🎉 Tebrikler! $${data.winAmount} kazandın!`;
            } else {
                resEl.style.color = '#fe2c55';
                resEl.innerText = `😢 Maalesef kaybettin: ${data.message}`;
            }
        });
    </script>
</body>
</html>
